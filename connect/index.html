<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061b49">
  <meta name="description" content="روابط التواصل الرسمية لشركة Trust Key Digital Solutions على فيسبوك وإنستجرام وواتساب.">
  <title>Trust Key Digital Solutions | تواصل معنا</title>
  <style>
    :root{color-scheme:dark;--navy:#061b49;--blue:#0d3da5;--bright:#2781ff;--cyan:#56d9ff;--white:#f7faff;--muted:#afc2e4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:26px 16px;background:radial-gradient(ellipse at 15% 15%,#123c9a 0%,transparent 42%),linear-gradient(145deg,#071943,#020b22 85%);font-family:Tahoma,Arial,sans-serif;color:var(--white)}
    main{width:min(100%,470px);text-align:center}
    .card{padding:22px 20px 20px;border:1px solid rgba(117,169,255,.25);border-radius:26px;background:rgba(5,20,53,.72);box-shadow:0 24px 70px rgba(0,0,0,.28);backdrop-filter:blur(10px)}
    .logo-frame{width:100%;aspect-ratio:25/8;max-height:140px;overflow:hidden;border-radius:18px;background:#071d55;position:relative}
    .logo-frame img{width:100%;height:100%;display:block;object-fit:contain;transform:none;object-position:center center}
    h1{font-size:clamp(23px,6vw,30px);line-height:1.45;margin:22px 0 5px;font-weight:800}
    h1 span{color:var(--cyan);direction:ltr;display:inline-block}
    .subtitle{margin:0 auto 23px;line-height:1.9;color:var(--muted);font-size:14px}
    .links{display:grid;gap:12px}
    .link{min-height:59px;padding:15px 18px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid rgba(151,190,255,.3);border-radius:15px;background:linear-gradient(110deg,rgba(18,50,105,.95),rgba(12,35,79,.95));color:var(--white);text-decoration:none;font-size:16px;font-weight:700;transition:transform .16s ease,border-color .16s ease,filter .16s ease}
    .link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--cyan);filter:brightness(1.12);outline:none}
    .link svg{width:23px;height:23px;flex:none}
    .whatsapp{background:linear-gradient(110deg,#087e78,#0a9d8d);border-color:rgba(96,255,226,.45)}
    .foot{margin:22px 0 0;color:#7797ce;font-size:11px;letter-spacing:2px;direction:ltr}
    @media(max-width:380px){.card{padding:16px 13px}.link{font-size:15px}}
    @media(prefers-reduced-motion:reduce){.link{transition:none}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-label="Trust Key contact links">
      <div class="logo-frame">
        <img src="trust-key-logo.webp?v=2" alt="Trust Key Digital Solutions logo">
      </div>
      <h1>كل طرق التواصل مع<br><span>Trust Key</span> في مكان واحد</h1>
      <p class="subtitle">تابعنا على السوشيال ميديا أو تواصل معانا مباشرة.</p>
      <nav class="links" aria-label="روابط التواصل">
        <a class="link" href="https://www.facebook.com/share/1FrnMWrbbJ/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"/></svg>
          تابعنا على فيسبوك
        </a>
        <a class="link" href="https://www.instagram.com/trustkey12?psln=NmZxeDZ5c3RwMHAy" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          تابعنا على إنستجرام
        </a>
        <a class="link whatsapp" href="https://wa.me/201014087861" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 2 17.7L.5 23.5l6-1.6A11.8 11.8 0 0 0 20.5 3.5ZM12 21a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.5.9.9-3.4-.2-.4A9.8 9.8 0 1 1 12 21Zm5.4-7.3c-.3-.1-1.7-.8-2-.9s-.5-.1-.7.2-.8.9-1 1.1-.4.2-.7.1a8.1 8.1 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.5-.6.3-.5c.1-.2 0-.4 0-.6l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.2-1.2 2.8 1.2 3.2 1.4 3.4a11.4 11.4 0 0 0 4.4 3.9c.6.2 1 .4 1.4.5.6.2 1.1.2 1.6.1.5-.1 1.7-.7 1.9-1.4s.2-1.3.1-1.4-.2-.2-.5-.3Z"/></svg>
          واتساب — 01014087861
        </a>
      </nav>
      <p class="foot">TRUST KEY · DIGITAL SOLUTIONS</p>
    </section>
  </main>
</body>
</html>
