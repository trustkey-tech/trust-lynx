<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071d3a">
<meta name="description" content="Trust Key Technology — تواصل معنا عبر فيسبوك وإنستجرام وواتساب.">
<title>Trust Key Technology | تواصل معنا</title>
<style>
:root{color-scheme:dark;--navy:#071d3a;--navy2:#0c315d;--cyan:#24d8ee;--white:#f7fbff;--muted:#b8cbe0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 0%,#164b79 0%,var(--navy) 54%,#031126 100%);font-family:Tahoma,Arial,sans-serif;color:var(--white)}
main{width:min(100%,440px);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(145deg,#22d9ef,#0876ca);display:grid;place-items:center;color:#062344;font-size:29px;font-weight:900;box-shadow:0 8px 30px #00bfe833}
h1{font-size:clamp(25px,7vw,34px);margin:0;letter-spacing:-.6px}
h1 span{color:var(--cyan)}
.tag{color:var(--muted);font-size:15px;line-height:1.8;margin:12px 0 26px}
.links{display:grid;gap:13px}
.link{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:16px 18px;border-radius:15px;text-decoration:none;color:var(--white);font-size:16px;font-weight:700;border:1px solid #3c6188;background:rgba(13,48,89,.86);transition:transform .15s,border-color .15s}
.link:hover{transform:translateY(-2px);border-color:var(--cyan)}
.link svg{width:23px;height:23px;flex:none}
.whatsapp{background:linear-gradient(110deg,#087d72,#0ca58e);border-color:#25d3b7}
.note{margin-top:24px;color:#91abc7;font-size:12px;letter-spacing:.4px}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo" aria-hidden="true">TK</div>
    <h1>TRUST KEY <span>TECHNOLOGY</span></h1>
  </div>
  <p class="tag">يسعدنا تواصلك معانا<br>اختار الطريقة المناسبة ليك</p>
  <section class="links" aria-label="روابط التواصل">
    <a class="link" href="https://www.facebook.com/share/1FrnMWrbbJ/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"/></svg>
      فيسبوك
    </a>
    <a class="link" href="https://www.instagram.com/trustkey12?psln=NmZxeDZ5c3RwMHAy" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      إنستجرام
    </a>
    <a class="link whatsapp" href="https://wa.me/201014087861" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 2 17.7L.5 23.5l6-1.6A11.8 11.8 0 0 0 20.5 3.5ZM12 21a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.5.9.9-3.4-.2-.4A9.8 9.8 0 1 1 12 21Zm5.4-7.3c-.3-.1-1.7-.8-2-.9s-.5-.1-.7.2-.8.9-1 1.1-.4.2-.7.1a8.1 8.1 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.5-.6.3-.5c.1-.2 0-.4 0-.6l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.2-1.2 2.8 1.2 3.2 1.4 3.4a11.4 11.4 0 0 0 4.4 3.9c.6.2 1 .4 1.4.5.6.2 1.1.2 1.6.1.5-.1 1.7-.7 1.9-1.4s.2-1.3.1-1.4-.2-.2-.5-.3Z"/></svg>
      واتساب — تواصل مباشر
    </a>
  </section>
  <p class="note">TRUST KEY TECHNOLOGY · CONNECT WITH CONFIDENCE</p>
</main>
</body>
</html>
